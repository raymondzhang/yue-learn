<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇭🇰 粤学乐园 — 繁体字 & 粤语学习陪练</title>
  <meta name="description" content="专为从内地转学到香港的小朋友设计的繁体字和粤语学习工具">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部导航栏 -->
  <header class="app-header">
    <div class="header-left" onclick="App.navigateTo('home')">
      <h1>🇭🇰 粤学乐园</h1>
    </div>
    <div class="header-right">
      <div class="stars">
        <span>⭐</span>
        <span id="star-count">0</span>
      </div>
      <div class="hearts" id="hearts-display">
        <span class="heart full">❤️</span>
        <span class="heart full">❤️</span>
        <span class="heart full">❤️</span>
        <span class="heart full">❤️</span>
        <span class="heart full">❤️</span>
      </div>
      <button class="settings-btn" onclick="App.navigateTo('stats')" title="学习统计">📊</button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main id="main-content">
    <!-- 由 JavaScript 动态渲染 -->
  </main>

  <!-- 脚本加载（注意顺序：数据 → 工具 → 主逻辑） -->
  <script src="js/data/characters.js"></script>
  <script src="js/data/phrases.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
